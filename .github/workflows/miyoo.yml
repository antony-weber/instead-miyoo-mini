name: Build Miyoo Mini Release

on:
  push:
    branches: [ miyoo-mini, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ miyoo-mini, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-miyoo:
    name: Build INSTEAD for Miyoo Mini (ARMhf)
    runs-on: ubuntu-latest
    container:
      image: debian:buster

    steps:
      - name: Setup Debian Buster Repositories
        run: |
          echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          dpkg --add-architecture armhf
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential \
            crossbuild-essential-armhf \
            cmake \
            pkg-config \
            zip \
            git \
            ca-certificates \
            libsdl2-dev:armhf \
            libsdl2-ttf-dev:armhf \
            libsdl2-image-dev:armhf \
            libsdl2-mixer-dev:armhf \
            liblua5.1-0-dev:armhf \
            zlib1g-dev:armhf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdl-instead
        run: |
          mkdir -p build_miyoo && cd build_miyoo
          cmake .. \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf \
            -DWITH_LUAJIT=OFF \
            -DWITH_GTK2=OFF \
            -DWITH_GTK3=OFF \
            -DSTANDALONE=ON \
            -DTARGET_MIYOO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link=/usr/lib/arm-linux-gnueabihf"
          make -j$(nproc)
          make install

      - name: Assemble Packages
        run: |
          # 1. Assemble Legacy App Package
          mkdir -p package/App/INSTEAD
          cp -r build_miyoo/standalone/* package/App/INSTEAD/
          cp -r miyoo_pkg/* package/App/INSTEAD/
          chmod +x package/App/INSTEAD/launch.sh package/App/INSTEAD/sdl-instead
          cd package && zip -r ../INSTEAD-Miyoo.zip App/ && cd ..
          rm -rf package

          # 2. Assemble Native OnionOS Emulator Package
          chmod +x package_onion.sh
          ./package_onion.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: INSTEAD-Packages
          path: |
            INSTEAD-OnionOS.zip
            INSTEAD-Miyoo.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            INSTEAD-OnionOS.zip
            INSTEAD-Miyoo.zip
          name: INSTEAD ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### INSTEAD for Miyoo Mini / Miyoo Mini Plus (Onion OS)
            
            **Installation / Установка:**
            - **OnionOS Emulator (Recommended / Рекомендуется):**
              Download `INSTEAD-OnionOS.zip`, extract into the root of your SD card. Put quests (`.zip` / `.idf` / folders) into `Roms/INSTEAD/`. Launch directly from the **Games / Consoles** carousel!
              Скачайте `INSTEAD-OnionOS.zip`, распакуйте в корень SD-карты. Поместите квесты (`.zip` / `.idf` / папки) в `Roms/INSTEAD/`. Запускайте прямо из меню выбора платформ!
            - **Standalone App:**
              Download `INSTEAD-Miyoo.zip`, extract into `App/INSTEAD/`. Launch from **Apps**.
              Скачайте `INSTEAD-Miyoo.zip`, распакуйте в `App/INSTEAD/`. Запустите из меню **Apps**.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}

