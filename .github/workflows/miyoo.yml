name: Build Miyoo Mini Release

on:
  push:
    branches: [ miyoo-mini, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ miyoo-mini, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-miyoo:
    name: Build INSTEAD for Miyoo Mini (ARMhf)
    runs-on: ubuntu-latest
    container:
      image: debian:buster

    steps:
      - name: Install Build Dependencies
        run: |
          echo "deb [check-valid-until=no] http://archive.debian.org/debian buster main" > /etc/apt/sources.list
          echo "deb [check-valid-until=no] http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          dpkg --add-architecture armhf
          apt-get update -qq
          apt-get dist-upgrade -y -qq
          apt-get install -y --no-install-recommends \
            build-essential \
            crossbuild-essential-armhf \
            cmake \
            pkg-config \
            zip \
            git \
            ca-certificates \
            libsdl2-dev:armhf \
            libsdl2-ttf-dev:armhf \
            libsdl2-image-dev:armhf \
            libsdl2-mixer-dev:armhf \
            liblua5.1-0-dev:armhf \
            zlib1g-dev:armhf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sdl-instead
        run: |
          mkdir -p build_miyoo && cd build_miyoo
          cmake .. \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf \
            -DWITH_LUAJIT=OFF \
            -DWITH_GTK2=OFF \
            -DWITH_GTK3=OFF \
            -DSTANDALONE=ON \
            -DTARGET_MIYOO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link=/usr/lib/arm-linux-gnueabihf"
          make -j$(nproc)
          make install

      - name: Assemble OnionOS Package
        run: |
          chmod +x package_onion.sh
          ./package_onion.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: INSTEAD-OnionOS
          path: INSTEAD-OnionOS.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: INSTEAD-OnionOS.zip
          name: INSTEAD ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### INSTEAD for Miyoo Mini / Miyoo Mini Plus (Onion OS)
            
            **Installation / Установка:**
            - **EN:** Download `INSTEAD-OnionOS.zip`, extract into the root of your SD card. Put quests (`.zip`, `.idf`, or folders) into `Roms/INSTEAD/`. Launch directly from the **Games / Consoles** carousel!
            - **RU:** Скачайте `INSTEAD-OnionOS.zip`, распакуйте в корень SD-карты. Поместите квесты (`.zip`, `.idf` или папки) в `Roms/INSTEAD/`. Запускайте прямо из меню выбора платформ!
            
            **Games / Игры:**
            - Download games from [instead-games.ru](https://instead-games.ru/) and put into `Roms/INSTEAD/`.
            - Скачивайте квесты с [instead-games.ru](https://instead-games.ru/) и копируйте в `Roms/INSTEAD/`.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}

